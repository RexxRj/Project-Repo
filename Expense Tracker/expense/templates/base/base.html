{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            {% block title %}
                Expense App
            {% endblock title %}
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet"
              integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
              crossorigin="anonymous">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playwrite+AU+SA:wght@100..400&family=Roboto+Condensed:wght@300&display=swap"
              rel="stylesheet">
        <link rel="stylesheet" href="{% static "base/base.css" %}">
        {% block css_files %}
        {% endblock css_files %}
    </head>
    <body>
        <nav class="navbar bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand ms-0 ps-0 d-flex align-items-center text-white"
                   href="#">
                    <img src="{% static "expense/images/expense_logo.png" %}" width="50" alt="Logo" class="d-inline-block align-text-top" />
                    <span class="fw-bold fs-3 ms-2">Expense Tracker</span>
                </a>
            </div>
        </nav>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarExample"
                        aria-controls="navbarExample"
                        aria-expanded="false"
                        aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarExample">
                    <ul class="navbar-nav me-auto fs-4 ms-4">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="{% url "index" %}">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="#">Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link"
                               aria-current="page"
                               href="{% url "transactions-page-default" %}">Transactions</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle"
                               href="#"
                               role="button"
                               data-bs-toggle="dropdown"
                               aria-expanded="false">Others</a>
                            <ul class="dropdown-menu">
                                <li>
                                    <a class="dropdown-item" href="#">Action</a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="#">Another action</a>
                                </li>
                                <li>
                                    <hr class="dropdown-divider" />
                                </li>
                                <li>
                                    <a class="dropdown-item" href="#">Something else here</a>
                                </li>
                            </ul>
                        </li>
                    </ul>
                    <div class="d-flex align-items-center flex-column flex-lg-row">
                        <form class="me-2 mb-2 mb-lg-0">
                            <input type="text" class="form-control form-control-sm" placeholder="Search" />
                        </form>
                        <a class="btn btn-primary" href="">Sign up</a>
                    </div>
                </div>
            </div>
        </nav>
        {% block content %}
        {% endblock content %}
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
                crossorigin="anonymous"></script>
    </body>
</html>
